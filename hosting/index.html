<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydrio — Smart Water Tracker</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #dbeafe 0%, #e0f2fe 30%, #f0f9ff 60%, #ede9fe 100%); color: #1f2937; padding: 24px; }
        .card { max-width: 480px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); border-radius: 24px; padding: 32px 28px; box-shadow: 0 20px 50px rgba(30, 64, 175, 0.08); text-align: center; }
        h1 { margin: 0 0 8px; font-size: 32px; background: linear-gradient(90deg, #38bdf8, #3b82f6, #6366f1); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .tag { display: inline-block; margin-bottom: 16px; padding: 4px 12px; background: rgba(59, 130, 246, 0.1); color: #3b82f6; font-size: 12px; font-weight: 600; border-radius: 999px; }
        p { color: #4b5563; line-height: 1.6; margin: 8px 0 20px; }
        .actions { display: flex; flex-direction: column; gap: 10px; }
        a.btn { display: block; padding: 12px 18px; border-radius: 14px; text-decoration: none; font-weight: 600; font-size: 14px; transition: transform 0.15s ease, box-shadow 0.15s ease; }
        a.btn:active { transform: scale(0.98); }
        a.btn-primary { background: linear-gradient(90deg, #38bdf8, #3b82f6); color: white; box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3); }
        a.btn-secondary { background: rgba(255, 255, 255, 0.6); color: #3b82f6; border: 1px solid rgba(59, 130, 246, 0.2); }
        .droplet { font-size: 56px; line-height: 1; margin-bottom: 6px; }
        @media (prefers-color-scheme: dark) {
            body { background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 40%, #0f172a 70%, #172554 100%); color: #f1f5f9; }
            .card { background: rgba(30, 41, 59, 0.7); }
            p { color: #cbd5e1; }
            a.btn-secondary { background: rgba(255, 255, 255, 0.05); color: #93c5fd; border-color: rgba(148, 163, 184, 0.15); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="droplet">💧</div>
        <span class="tag">Smart Water Tracker</span>
        <h1>Hydrio</h1>
        <p>Personal hydration tracker that helps you build healthy water habits.</p>
        <div class="actions">
            <a class="btn btn-primary" href="https://play.google.com/store/apps/details?id=com.hydrio.app">Get it on Google Play</a>
            <a class="btn btn-secondary" href="/privacy-policy.html">Privacy Policy</a>
            <a class="btn btn-secondary" href="mailto:lumedev.co@gmail.com">Contact / Feedback</a>
        </div>
    </div>
</body>
</html>
