<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="droplet-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="droplet-glow-bg" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg-grad)"/>

  <!-- Soft glow behind droplet -->
  <ellipse cx="512" cy="560" rx="360" ry="380" fill="url(#droplet-glow-bg)"/>

  <!-- Droplet, slightly larger for full icon -->
  <path d="M512 180 C 360 360, 240 540, 240 700 C 240 850, 360 920, 512 920 C 664 920, 784 850, 784 700 C 784 540, 664 360, 512 180 Z"
        fill="url(#droplet-grad)"/>

  <!-- Highlight on top-left -->
  <ellipse cx="408" cy="500" rx="60" ry="130" fill="white" opacity="0.5"/>
  <ellipse cx="428" cy="350" rx="28" ry="52" fill="white" opacity="0.75"/>

  <!-- Subtle bottom-right reflection -->
  <ellipse cx="620" cy="780" rx="48" ry="26" fill="white" opacity="0.18" transform="rotate(-20 620 780)"/>
</svg>
