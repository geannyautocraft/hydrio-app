<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-en" cx="40%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="mascot-grad-en" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accent-en" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow-en" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg-en)"/>

  <!-- Mascot glow on the right -->
  <ellipse cx="820" cy="250" rx="220" ry="220" fill="url(#glow-en)"/>

  <!-- Mascot Hyd-rio, right side -->
  <g transform="translate(700, 110) scale(2.6)">
    <path d="M50 6 C35 26 20 48 18 76 C18 100 32 115 50 115 C68 115 82 100 82 76 C80 48 65 26 50 6 Z" fill="url(#mascot-grad-en)"/>
    <ellipse cx="35" cy="50" rx="5" ry="12" fill="white" opacity="0.55"/>
    <ellipse cx="40" cy="30" rx="2.5" ry="5" fill="white" opacity="0.75"/>
    <ellipse cx="32" cy="92" rx="4" ry="3" fill="#FCA5A5" opacity="0.55"/>
    <ellipse cx="68" cy="92" rx="4" ry="3" fill="#FCA5A5" opacity="0.55"/>
    <circle cx="38" cy="80" r="4.5" fill="#0F172A"/>
    <circle cx="62" cy="80" r="4.5" fill="#0F172A"/>
    <circle cx="36.5" cy="78" r="1.5" fill="white"/>
    <circle cx="60.5" cy="78" r="1.5" fill="white"/>
    <path d="M38 95 Q50 106 62 95" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Punchy 3-line headline -->
  <text x="60" y="160" font-family="-apple-system, BlinkMacSystemFont, Inter, 'Segoe UI', Arial, sans-serif" font-size="62" font-weight="800" fill="white" letter-spacing="-2">Drink water.</text>
  <text x="60" y="240" font-family="-apple-system, BlinkMacSystemFont, Inter, 'Segoe UI', Arial, sans-serif" font-size="62" font-weight="800" fill="white" letter-spacing="-2">Build habits.</text>
  <text x="60" y="320" font-family="-apple-system, BlinkMacSystemFont, Inter, 'Segoe UI', Arial, sans-serif" font-size="62" font-weight="800" fill="url(#accent-en)" letter-spacing="-2">Live better.</text>

  <!-- Subtle brand tag at bottom-left -->
  <text x="60" y="430" font-family="-apple-system, BlinkMacSystemFont, Inter, 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="500" fill="#94A3B8" letter-spacing="1">WITH HYD-RIO</text>
</svg>
