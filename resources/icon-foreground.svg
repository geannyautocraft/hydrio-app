<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="droplet-grad-fg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="droplet-glow" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft outer glow behind the droplet -->
  <ellipse cx="512" cy="600" rx="320" ry="340" fill="url(#droplet-glow)"/>

  <!-- Droplet body, centered for adaptive icon safe area -->
  <path d="M512 240 C 380 388, 290 538, 290 670 C 290 754, 388 800, 512 800 C 636 800, 734 754, 734 670 C 734 538, 644 388, 512 240 Z"
        fill="url(#droplet-grad-fg)"/>

  <!-- Strong shine highlight on top-left -->
  <ellipse cx="418" cy="500" rx="52" ry="110" fill="white" opacity="0.5"/>
  <ellipse cx="430" cy="370" rx="22" ry="42" fill="white" opacity="0.75"/>

  <!-- Subtle bottom-right reflection -->
  <ellipse cx="615" cy="720" rx="40" ry="22" fill="white" opacity="0.18" transform="rotate(-20 615 720)"/>
</svg>
